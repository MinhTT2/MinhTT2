<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="190" viewBox="0 0 1200 190" role="img" aria-labelledby="title"><title id="title">From user flow to deployed product</title>
<rect width="1200" height="190" rx="18" fill="{{color.canvas}}"/>
<g font-family="{{font.family}}">
<text x="30" y="31" font-size="13" font-weight="700" letter-spacing="2" fill="{{color.muted}}">FROM USER FLOW TO DEPLOYED PRODUCT</text>
<rect x="18" y="48" width="280" height="124" rx="13" fill="{{color.primary_soft}}"/>
<rect x="312" y="48" width="280" height="124" rx="13" fill="{{color.primary_soft}}"/>
<rect x="606" y="48" width="280" height="124" rx="13" fill="{{color.primary_soft}}"/>
<rect x="900" y="48" width="280" height="124" rx="13" fill="{{color.accent_soft}}"/>
<g font-size="14" font-weight="700"><text x="34" y="78" fill="{{color.primary}}">01 / BUILD</text><text x="328" y="78" fill="{{color.primary}}">02 / MODEL</text><text x="622" y="78" fill="{{color.primary}}">03 / VERIFY</text><text x="916" y="78" fill="{{color.accent}}">04 / SHIP</text></g>
<g font-size="24" font-weight="700" fill="{{color.ink}}"><text x="34" y="115">Interfaces + APIs</text><text x="328" y="115">Data + rules</text><text x="622" y="115">Tests + CI</text><text x="916" y="115">Deploy + iterate</text></g>
<g font-size="13" fill="{{color.muted}}"><text x="34" y="146">React · TypeScript · NestJS</text><text x="328" y="146">PostgreSQL · Prisma · Redis</text><text x="622" y="146">Jest · Vitest · Playwright</text><text x="916" y="146">Docker · GitHub Actions</text></g>
</g></svg>
